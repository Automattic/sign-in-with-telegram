name: release-please

on:
  push:
    branches: [trunk]

# Default-deny all permissions; the job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # We pass a PAT (RELEASE_PLEASE_TOKEN) rather than the default
      # GITHUB_TOKEN because GitHub does not fan out workflow triggers from
      # events created by GITHUB_TOKEN. Without a PAT, the Release PR opens
      # with zero checks (CI / Plugin Check skip), the tag push triggers no
      # downstream workflow, and the `release: published` event never fires
      # deploy.yml. All silent failures. Provision the secret as a
      # fine-grained PAT scoped to this repo with `contents: write` +
      # `pull-requests: write`.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        id: release
        with:
          target-branch: trunk
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # When release-please opens or updates a Release PR, mirror
      # CHANGELOG.md into readme.txt's == Changelog == block on the same
      # branch. We push back to the Release-PR branch (not trunk), so this
      # does NOT re-trigger this workflow — the trigger filter is
      # `branches: [trunk]`.
      - name: Check out Release PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: true

      - name: Sync readme.txt from CHANGELOG.md and PHP Version header
        if: steps.release.outputs.pr
        run: |
          bin/sync-readme-changelog.sh
          bin/sync-readme-version.sh
          if ! git diff --quiet readme.txt; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add readme.txt
            git commit -m "chore: sync readme.txt from CHANGELOG.md + plugin header"
            git push
          fi
