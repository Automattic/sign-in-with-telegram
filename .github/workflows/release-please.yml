name: Release Please

on:
  push:
    branches: [trunk]

# Default-deny all permissions; the job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        id: release
        with:
          target-branch: trunk
          token: ${{ secrets.API_TOKEN_GITHUB }}

      # When release-please opens or updates a Release PR, mirror
      # CHANGELOG.md into readme.txt's == Changelog == block on the same
      # branch. We push back to the Release-PR branch (not trunk), so this
      # does NOT re-trigger this workflow — the trigger filter is
      # `branches: [trunk]`.
      - name: Check out Release PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.API_TOKEN_GITHUB }}
          persist-credentials: true

      # bin/cli/index.mts is TypeScript run via Node 24's native type-stripping.
      - name: Set up Node
        if: steps.release.outputs.pr
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'

      - name: Sync readme.txt from CHANGELOG.md and PHP Version header
        if: steps.release.outputs.pr
        run: |
          node bin/cli/index.mts sync-changelog
          node bin/cli/index.mts sync-version
          if ! git diff --quiet readme.txt; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add readme.txt
            git commit -m "chore: sync readme.txt from CHANGELOG.md + plugin header"
            git push
          fi
