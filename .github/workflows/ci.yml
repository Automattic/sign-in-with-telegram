name: CI

on:
  pull_request:
  push:
    branches: [ trunk ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHPCS
        run: composer phpcs

      - name: PHPUnit
        run: composer phpunit

  js:
    name: JS / TS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JS / TS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test

      - name: Build
        run: npm run build
